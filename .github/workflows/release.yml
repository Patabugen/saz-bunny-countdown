name: Build and attach release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Saz-Bunny-Countdown.app
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Run tests
        run: |
          xcodebuild test \
            -project SazBunnyCountdown.xcodeproj \
            -scheme SazBunnyCountdown \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-"

      - name: Build release
        run: |
          xcodebuild \
            -project SazBunnyCountdown.xcodeproj \
            -scheme SazBunnyCountdown \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}"

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release/SazBunnyCountdown.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::SazBunnyCountdown.app not found at $APP_PATH"
            find build -name "*.app" -type d
            exit 1
          fi

          cp -R "$APP_PATH" "Saz-Bunny-Countdown.app"

          # Ad-hoc sign the full bundle (seals resources so Gatekeeper accepts it)
          codesign --force --deep --sign - "Saz-Bunny-Countdown.app"
          codesign --verify --verbose "Saz-Bunny-Countdown.app"

          ditto -c -k --sequesterRsrc --keepParent "Saz-Bunny-Countdown.app" "Saz-Bunny-Countdown.zip"

          echo "Package created:"
          ls -lh Saz-Bunny-Countdown.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            Saz-Bunny-Countdown.zip \
            --clobber
