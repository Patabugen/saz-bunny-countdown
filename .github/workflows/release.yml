name: Build and attach release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build Saz-Bunny.app
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build release
        run: |
          xcodebuild \
            -scheme CountdownTimer \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.version }}"

      - name: Package app
        run: |
          APP_PATH="build/Build/Products/Release/CountdownTimer.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::CountdownTimer.app not found at $APP_PATH"
            find build -name "*.app" -type d
            exit 1
          fi

          cp -R "$APP_PATH" "Saz-Bunny.app"
          ditto -c -k --sequesterRsrc --keepParent "Saz-Bunny.app" "Saz-Bunny.zip"

          echo "Package created:"
          ls -lh Saz-Bunny.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            Saz-Bunny.zip \
            --clobber
